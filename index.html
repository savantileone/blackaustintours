<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Black Austin Tours — Operations</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1C1814">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="B.A.T.">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{ --ink:#1C1814; --ink-2:#2B241C; --paper:#EDE7DC; --gold:#B07D12; --gold-lt:#E8C877;
         --line:rgba(255,255,255,.14); --muted:#A79B86; --brick:#D98E7E;
         --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
         --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);font-family:var(--sans)}
  #lock{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:360px;color:#EFE7D8}
  .mark{font-family:var(--serif);font-size:24px;line-height:1.2;color:#fff;text-align:center}
  .mark em{display:block;font-style:normal;color:var(--gold-lt);font-size:14px;margin-top:4px}
  form{margin-top:28px}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  input[type=password]{width:100%;background:var(--ink-2);border:1px solid var(--line);color:#fff;
    border-radius:6px;padding:11px 12px;font-size:15px;letter-spacing:.5px}
  input[type=password]:focus{outline:2px solid var(--gold);outline-offset:1px}
  button{width:100%;margin-top:14px;background:var(--gold);border:1px solid var(--gold);color:#241A05;
    font-weight:600;font-size:14.5px;padding:11px;border-radius:6px;cursor:pointer;font-family:inherit}
  button:hover{filter:brightness(1.07)}
  button[disabled]{opacity:.55;cursor:not-allowed}
  .msg{min-height:18px;font-size:13px;margin-top:12px;text-align:center}
  .msg.err{color:var(--brick)}
  .msg.ok{color:#9CC08A}
  .remember{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:12.5px;color:var(--muted)}
  .remember input{width:auto}
  .foot{text-align:center;font-size:11.5px;color:#7E7462;margin-top:22px}
  #app{position:fixed;inset:0;border:0;width:100%;height:100%;display:none}
  #app.on{display:block}
</style>
</head>
<body>
<div id="lock">
  <div class="card">
    <div class="mark">Black Austin Tours<em>Internal operations — passphrase required</em></div>
    <form id="f" autocomplete="off">
      <label for="pw">Passphrase</label>
      <input type="password" id="pw" autocomplete="off" spellcheck="false" autofocus>
      <div class="remember"><input type="checkbox" id="remember" checked>
        <label for="remember" style="margin:0">Remember on this device</label></div>
      <button type="submit" id="go">Unlock</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="foot">If you don't have the passphrase, ask whoever manages this workspace.<br>Shared device? Use <b>Lock this device</b> inside Workspace before handing it off.</div>
  </div>
</div>
<iframe id="app" title="Black Austin Tours operations app"
  sandbox="allow-scripts allow-forms allow-popups allow-modals allow-downloads allow-same-origin"></iframe>

<script>
(function(){
  var PAYLOAD_URL = 'app.encrypted';
  var STORE_KEY = 'bat_lock_key_v1';
  // Remembering "between app opens" (not just this tab) means the key has to
  // live in localStorage rather than sessionStorage. That is a deliberate
  // trade of convenience for security, made at the user's request — anyone
  // who can unlock this device's browser storage can open the app without
  // the passphrase. The "Lock this device" control inside Workspace clears it.
  var subtle = window.crypto.subtle;
  var msg = document.getElementById('msg');
  var pw = document.getElementById('pw');
  var go = document.getElementById('go');
  var form = document.getElementById('f');
  var remember = document.getElementById('remember');
  var frame = document.getElementById('app');
  var lockDiv = document.getElementById('lock');

  function b64ToBytes(b64){
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function bytesToB64(bytes){
    var bin = '';
    for(var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  async function fetchPayload(){
    var res;
    try{
      res = await fetch(PAYLOAD_URL, {cache:'no-store'});
    }catch(e){
      var netErr = new Error('Could not reach app.encrypted. Both files need to be hosted together (for example, both at the root of your GitHub Pages site) — this message is expected in a standalone preview.');
      netErr.kind = 'fetch';
      throw netErr;
    }
    if(!res.ok){
      var statusErr = new Error('Could not load the app file (' + res.status + ').');
      statusErr.kind = 'fetch';
      throw statusErr;
    }
    var text = await res.text();
    var parts = text.trim().split('.');
    if(parts.length !== 3){
      var shapeErr = new Error('The app file looks corrupted.');
      shapeErr.kind = 'fetch';
      throw shapeErr;
    }
    return {salt: b64ToBytes(parts[0]), iv: b64ToBytes(parts[1]), data: b64ToBytes(parts[2])};
  }

  async function deriveKey(passphrase, salt){
    var enc = new TextEncoder();
    var keyMaterial = await subtle.importKey('raw', enc.encode(passphrase), {name:'PBKDF2'}, false, ['deriveKey']);
    return subtle.deriveKey(
      {name:'PBKDF2', salt: salt, iterations: 300000, hash:'SHA-256'},
      keyMaterial, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']
    );
  }

  async function decryptWithKey(key, iv, data){
    var plain = await subtle.decrypt({name:'AES-GCM', iv: iv}, key, data);
    return new TextDecoder().decode(plain);
  }

  function showApp(html){
    lockDiv.style.display = 'none';
    frame.srcdoc = html;
    frame.className = 'on';
  }

  async function tryStoredKey(){
    var stored = localStorage.getItem(STORE_KEY);
    if(!stored) return false;
    var payload;
    try{
      payload = await fetchPayload();
    }catch(e){ return false; }  // can't reach the file — fall through to the prompt quietly
    try{
      var rawKey = b64ToBytes(stored);
      var key = await subtle.importKey('raw', rawKey, {name:'AES-GCM'}, false, ['decrypt']);
      var html = await decryptWithKey(key, payload.iv, payload.data);
      showApp(html);
      return true;
    }catch(e){
      localStorage.removeItem(STORE_KEY);
      return false;
    }
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var phrase = pw.value;
    if(!phrase){ return; }
    go.disabled = true; msg.className = 'msg'; msg.textContent = 'Checking…';
    try{
      var payload = await fetchPayload();
      var key = await deriveKey(phrase, payload.salt);
      var html = await decryptWithKey(key, payload.iv, payload.data);
      if(remember.checked){
        var raw = await subtle.exportKey('raw', key);
        localStorage.setItem(STORE_KEY, bytesToB64(new Uint8Array(raw)));
      }
      msg.className = 'msg ok'; msg.textContent = 'Unlocked.';
      showApp(html);
    }catch(err){
      // A wrong passphrase and a corrupted file both surface as a decrypt
      // failure here — that's intentional, it gives an attacker nothing to
      // work with beyond "no". Fetch/network problems are tagged separately
      // above so this message stays honest about which one happened.
      await new Promise(function(r){ setTimeout(r, 500); }); // slows guessing
      msg.className = 'msg err';
      msg.textContent = err.kind === 'fetch' ? err.message : 'Incorrect passphrase.';
      go.disabled = false;
      pw.value = '';
      pw.focus();
    }
  });

  window.addEventListener('message', function(e){
    if(e.data === 'bat-lock'){
      localStorage.removeItem(STORE_KEY);
      location.reload();
    }
  });

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* offline caching is a nicety, not a requirement */ });
  }

  tryStoredKey();
})();
</script>
</body>
</html>
