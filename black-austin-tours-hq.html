<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Austin Tours — Operations</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#1C1814; --ink-2:#2B241C; --ink-3:#3D3428;
  --paper:#EDE7DC; --panel:#FBF8F2; --panel-2:#F4EFE5;
  --line:#D9D0C0; --line-2:#C4B9A5;
  --gold:#B07D12; --gold-lt:#E8C877; --river:#2C6A6B; --brick:#8E3B2C; --moss:#5A6B39;
  --text:#221D17; --muted:#6E6455;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --rail:248px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--paper);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--river)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.1px}
:focus-visible{outline:2px solid var(--river);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.app{display:flex;min-height:100%}
.rail{width:var(--rail);flex:0 0 var(--rail);background:var(--ink);color:#EFE7D8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand .mark{font-family:var(--serif);font-size:20px;line-height:1.15;color:#fff}
.brand .mark em{display:block;font-style:normal;color:var(--gold-lt)}
.brand .sub{font-size:11.5px;color:#A79B86;margin-top:6px}
.nav{padding:10px 10px;overflow-y:auto;flex:1}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#D8CEBC;padding:9px 10px;border-radius:5px;cursor:pointer;font-size:14px}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:var(--ink-3);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav .glyph{width:20px;text-align:center;font-size:15px;opacity:.85}
.nav .count{margin-left:auto;font-size:11px;color:#9E937E;font-variant-numeric:tabular-nums}
.who{border-top:1px solid rgba(255,255,255,.1);padding:12px}
.who label{display:block;font-size:11px;color:#9E937E;margin-bottom:5px}
.who select{width:100%;background:var(--ink-2);border:1px solid rgba(255,255,255,.14);color:#EFE7D8;border-radius:5px;padding:7px 8px;font-size:13px}
.who .saved{font-size:11px;color:#7E7462;margin-top:8px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:flex-end;gap:16px;padding:22px 28px 14px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:20}
.topbar h1{font-size:25px}
.topbar .blurb{color:var(--muted);font-size:13px;margin-top:3px;max-width:62ch}
.topbar .acts{margin-left:auto;display:flex;gap:8px;align-items:center}
.view{padding:22px 28px 60px;max-width:1220px}

/* ---------- controls ---------- */
.btn{border:1px solid var(--line-2);background:var(--panel);padding:7px 13px;border-radius:5px;cursor:pointer;font-size:13.5px}
.btn:hover{background:#fff;border-color:var(--muted)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#F7F1E4}
.btn.primary:hover{background:var(--ink-3)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#241A05;font-weight:600}
.btn.gold:hover{filter:brightness(1.07)}
.btn.sm{padding:3px 9px;font-size:12.5px;border-radius:4px}
.btn.danger{color:var(--brick);border-color:#D9B6AD}
.btn.danger:hover{background:#F7E9E5}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field>span{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=url],input[type=email],input[type=tel],select,textarea{
  border:1px solid var(--line-2);background:#fff;border-radius:5px;padding:8px 9px;width:100%}
textarea{min-height:110px;resize:vertical;line-height:1.55}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .search{flex:1;min-width:180px;max-width:340px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#F7F1E4}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px}
.panel>header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel>header h3{font-size:16px}
.panel>header .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.panel .body{padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.meta{font-size:12.5px;color:var(--muted)}
.empty{border:1px dashed var(--line-2);border-radius:3px;padding:26px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-family:var(--serif);font-size:16px;color:var(--text);margin-bottom:5px;font-weight:600}

/* ---------- tables / rows ---------- */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line-2)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--panel-2)}
.num{font-variant-numeric:tabular-nums}

/* ---------- tags & status ---------- */
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);margin:2px 4px 2px 0}
.tag.solid{background:var(--ink);border-color:var(--ink);color:#EFE7D8}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.status:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-open{color:var(--moss)} .s-limited{color:var(--gold)} .s-full{color:var(--brick)} .s-cancelled{color:var(--muted)} .s-private{color:var(--river)}
.bar{height:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--river)}
.bar i.hot{background:var(--gold)} .bar i.max{background:var(--brick)}

/* ---------- dashboard ---------- */
.today{background:var(--ink);color:#F1E9DA;border-radius:3px;padding:20px 22px;margin-bottom:20px}
.today .date{font-size:12.5px;color:var(--gold-lt);margin-bottom:4px}
.today h2{color:#fff;font-size:22px}
.today .runs{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.run{background:var(--ink-2);border:1px solid rgba(255,255,255,.12);border-radius:3px;padding:11px 14px;min-width:210px}
.run b{display:block;font-family:var(--serif);font-size:15px;color:#fff;font-weight:600}
.run .l{font-size:12.5px;color:#A79B86;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:20px}
.stat{background:var(--panel);padding:14px 16px}
.stat b{display:block;font-family:var(--serif);font-size:27px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}

/* ---------- map / builder ---------- */
#map,#fallbackmap{height:460px;border:1px solid var(--line-2);border-radius:3px;background:var(--panel-2)}
#fallbackmap{position:relative;overflow:hidden;cursor:crosshair}
#fallbackmap .fg{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.6}
#fallbackmap .note{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--muted)}
.fpin{position:absolute;transform:translate(-50%,-100%);background:var(--ink);color:var(--gold-lt);border-radius:50% 50% 50% 2px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;rotate:-45deg}
.fpin span{rotate:45deg}
.stop{border:1px solid var(--line);border-left:3px solid var(--gold);background:var(--panel);border-radius:3px;padding:11px 13px;margin-bottom:9px}
.stop .hd{display:flex;gap:9px;align-items:baseline}
.stop .n{font-family:var(--serif);font-weight:700;color:var(--gold);min-width:18px;font-variant-numeric:tabular-nums}
.stop .hd b{font-size:15px;font-family:var(--serif);font-weight:600}
.stop .hd .sp{margin-left:auto;display:flex;gap:4px}
.stop details{margin-top:8px}
.stop summary{cursor:pointer;font-size:12.5px;color:var(--river)}
.leaflet-container{font:inherit}
.numpin{background:var(--ink);color:var(--gold-lt);border:2px solid var(--gold);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}

/* ---------- media ---------- */
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.mcard{border:1px solid var(--line);background:var(--panel);border-radius:3px;overflow:hidden;display:flex;flex-direction:column}
.mcard .th{height:124px;background:var(--panel-2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--line-2);border-bottom:1px solid var(--line)}
.mcard .cap{padding:9px 11px;font-size:13px;flex:1}
.mcard .cap .meta{margin-top:3px}
.mcard .row{display:flex;gap:6px;padding:0 11px 10px}
.drop{border:1px dashed var(--line-2);border-radius:3px;padding:18px;text-align:center;color:var(--muted);font-size:13px;margin-bottom:16px}
.drop.over{background:#fff;border-color:var(--river);color:var(--river)}

/* ---------- people ---------- */
.person{display:flex;gap:13px;padding:14px;border:1px solid var(--line);background:var(--panel);border-radius:3px}
.avatar{width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:var(--ink);color:var(--gold-lt);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:17px;font-weight:600;background-size:cover;background-position:center}
.person h4{font-size:16px}
.person .role{font-size:12.5px;color:var(--gold);font-weight:600}
.person .lines{font-size:13px;margin-top:7px}
.person .lines div{margin-bottom:2px}

/* ---------- notes ---------- */
.actionitem{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}
.actionitem:last-child{border-bottom:0}
.actionitem input{margin-top:4px;width:auto;flex:0 0 auto}
.actionitem.done label{text-decoration:line-through;color:var(--muted)}
.prose{white-space:pre-wrap;line-height:1.62;max-width:74ch}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(24,20,16,.55);display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;overflow-y:auto;z-index:100}
.modal{background:var(--panel);border-radius:4px;width:min(640px,100%);box-shadow:0 18px 50px rgba(0,0,0,.3)}
.modal.wide{width:min(880px,100%)}
.modal header{display:flex;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line)}
.modal header h3{font-size:18px}
.modal header .x{margin-left:auto;background:none;border:0;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
.modal .body{padding:20px;max-height:66vh;overflow-y:auto}
.modal footer{display:flex;gap:9px;justify-content:flex-end;padding:13px 20px;border-top:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.picklist{border:1px solid var(--line-2);background:#fff;border-radius:5px;max-height:170px;overflow-y:auto;padding:6px}
.picklist label{display:flex;gap:8px;align-items:flex-start;padding:4px 5px;font-size:13.5px;border-radius:3px;cursor:pointer}
.picklist label:hover{background:var(--panel-2)}
.picklist input{width:auto;margin-top:3px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#F3ECDE;padding:10px 18px;border-radius:4px;font-size:13.5px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.3)}

@media (max-width:900px){
  .app{flex-direction:column}
  .rail{width:100%;flex:none;height:auto;position:static}
  .nav{display:grid;grid-template-columns:repeat(2,1fr);gap:2px}
  .split{grid-template-columns:1fr}
  .view,.topbar{padding-left:16px;padding-right:16px}
  .topbar{flex-wrap:wrap}
}
@media print{
  .rail,.topbar .acts,.btn,.toolbar{display:none!important}
  body{background:#fff}
  .panel{border:0}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="mark">Black Austin Tours<em>Operations</em></div>
      <div class="sub">Powerful stories. Passionate guides.</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="who">
      <label for="whoami">Working as</label>
      <select id="whoami"></select>
      <div class="saved" id="savedstate">Loading…</div>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="vtitle">Today</h1>
        <div class="blurb" id="vblurb"></div>
      </div>
      <div class="acts" id="vacts"></div>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>
<div id="modalroot"></div>
<script type="text/plain" id="gscode">/**
 * Black Austin Tours — Operations backend
 * Paste this into Apps Script on a Google Sheet, deploy it as a web app,
 * and paste the web app URL into the Workspace tab of the operations app.
 *
 * Every collection gets its own tab. You can edit cells in the sheet by hand
 * and the app will pick the changes up on its next pull.
 */

// Optional. Set a word here and paste the same word into the app to keep
// strangers with the link out. Leave empty for no check.
var SHARED_TOKEN = '';

var TABS = {
  tours:    ['id','name','type','duration','distance','capacity','price','meet','blurb'],
  events:   ['id','tourId','date','time','guide','capacity','booked','status','note'],
  research: ['id','title','type','author','year','tags','source','body','by','added'],
  routes:   ['id','name','tourId','notes'],
  stops:    ['id','routeId','position','name','lat','lng','mins','script','research'],
  notes:    ['id','title','date','attendees','body','by'],
  actions:  ['id','noteId','text','who','due','done'],
  media:    ['id','title','kind','url','date','tags','credit','by','thumb'],
  people:   ['id','name','role','email','phone','languages','tours','photo','bio','notes'],
  contacts: ['id','name','org','kind','email','phone','address','tags','notes']
};
var LISTS  = {research:['tags'], stops:['research'], notes:['attendees'], media:['tags'], contacts:['tags']};
var NUMS   = {tours:['capacity'], events:['capacity','booked'], stops:['position','lat','lng','mins']};
var DATES  = {events:['date'], research:['added'], notes:['date'], actions:['due'], media:['date']};
var BOOLS  = {actions:['done']};
var SEP = ' | ';

/* ---------------- entry points ---------------- */

function doGet(e) {
  var action = (e && e.parameter && e.parameter.action) || 'ping';
  return respond(handle({action: action, token: (e && e.parameter && e.parameter.token) || ''}));
}

function doPost(e) {
  var body = {};
  try { body = JSON.parse(e.postData.contents); } catch (err) { body = {}; }
  return respond(handle(body));
}

function handle(req) {
  if (SHARED_TOKEN && String(req.token || '') !== SHARED_TOKEN) {
    return {error: 'That access word does not match the one set in the script.'};
  }
  var lock = LockService.getScriptLock();
  try {
    lock.waitLock(20000);
  } catch (err) {
    return {error: 'The sheet is busy. Try again in a moment.'};
  }
  try {
    if (req.action === 'ping') return meta();
    if (req.action === 'load') { var m = meta(); m.data = readAll(); return m; }
    if (req.action === 'save') return saveAll(req);
    return {error: 'Unknown action: ' + req.action};
  } catch (err) {
    return {error: String(err)};
  } finally {
    lock.releaseLock();
  }
}

function respond(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}

/* ---------------- meta ---------------- */

function ss() { return SpreadsheetApp.getActiveSpreadsheet(); }

function metaSheet() {
  var sh = ss().getSheetByName('Meta');
  if (!sh) {
    sh = ss().insertSheet('Meta');
    sh.getRange(1, 1, 4, 2).setValues([['key', 'value'], ['rev', '0'], ['updated', ''], ['by', '']]);
    sh.setFrozenRows(1);
  }
  return sh;
}

function meta() {
  var vals = metaSheet().getDataRange().getValues();
  var out = {ok: true, rev: 0, updated: '', by: ''};
  vals.forEach(function (r) {
    if (r[0] === 'rev') out.rev = Number(r[1]) || 0;
    if (r[0] === 'updated') out.updated = String(r[1] || '');
    if (r[0] === 'by') out.by = String(r[1] || '');
  });
  return out;
}

function setMeta(rev, by) {
  var sh = metaSheet();
  var vals = sh.getDataRange().getValues();
  var stamp = new Date().toISOString();
  for (var i = 0; i < vals.length; i++) {
    if (vals[i][0] === 'rev') sh.getRange(i + 1, 2).setValue(String(rev));
    if (vals[i][0] === 'updated') sh.getRange(i + 1, 2).setValue(stamp);
    if (vals[i][0] === 'by') sh.getRange(i + 1, 2).setValue(String(by || ''));
  }
  return {ok: true, rev: rev, updated: stamp, by: by || ''};
}

/* ---------------- read ---------------- */

function readTab(name) {
  var headers = TABS[name];
  var sh = ss().getSheetByName(tabTitle(name));
  if (!sh) return [];
  var vals = sh.getDataRange().getValues();
  if (vals.length < 2) return [];
  var head = vals[0].map(function (h) { return String(h).trim(); });
  var rows = [];
  for (var r = 1; r < vals.length; r++) {
    if (String(vals[r][0]).trim() === '') continue;
    var o = {};
    head.forEach(function (h, i) { if (headers.indexOf(h) > -1) o[h] = vals[r][i]; });
    headers.forEach(function (h) { if (!(h in o)) o[h] = ''; });
    rows.push(coerce(name, o));
  }
  return rows;
}

function coerce(name, o) {
  (LISTS[name] || []).forEach(function (f) {
    o[f] = String(o[f] || '').split(SEP).map(function (s) { return s.trim(); }).filter(String);
  });
  (NUMS[name] || []).forEach(function (f) { o[f] = Number(o[f]) || 0; });
  (BOOLS[name] || []).forEach(function (f) {
    var v = String(o[f]).toLowerCase();
    o[f] = (v === 'true' || v === 'yes' || v === 'done' || v === '1');
  });
  (DATES[name] || []).forEach(function (f) { o[f] = asISO(o[f]); });
  Object.keys(o).forEach(function (k) { if (typeof o[k] === 'object' && o[k] instanceof Date) o[k] = asISO(o[k]); });
  Object.keys(o).forEach(function (k) { if (o[k] === null || o[k] === undefined) o[k] = ''; });
  return o;
}

function asISO(v) {
  if (!v) return '';
  if (v instanceof Date) {
    return Utilities.formatDate(v, Session.getScriptTimeZone(), 'yyyy-MM-dd');
  }
  return String(v).trim();
}

function readAll() {
  var db = {
    tours: readTab('tours'),
    events: readTab('events'),
    research: readTab('research'),
    routes: readTab('routes'),
    notes: readTab('notes'),
    media: readTab('media'),
    people: readTab('people'),
    contacts: readTab('contacts'),
    meta: {source: 'google-sheets'}
  };
  var stops = readTab('stops').sort(function (a, b) { return a.position - b.position; });
  db.routes.forEach(function (r) {
    r.stops = stops.filter(function (s) { return s.routeId === r.id; })
      .map(function (s) {
        return {id: s.id, name: s.name, lat: s.lat, lng: s.lng, mins: s.mins, script: s.script, research: s.research};
      });
  });
  var actions = readTab('actions');
  db.notes.forEach(function (n) {
    n.actions = actions.filter(function (a) { return a.noteId === n.id; })
      .map(function (a) { return {id: a.id, text: a.text, who: a.who, due: a.due, done: a.done}; });
  });
  return db;
}

/* ---------------- write ---------------- */

function tabTitle(name) { return name.charAt(0).toUpperCase() + name.slice(1); }

function writeTab(name, rows) {
  var headers = TABS[name];
  var sh = ss().getSheetByName(tabTitle(name));
  if (!sh) sh = ss().insertSheet(tabTitle(name));
  sh.clear();
  var data = [headers];
  rows.forEach(function (o) {
    data.push(headers.map(function (h) {
      var v = o[h];
      if (Array.isArray(v)) return v.join(SEP);
      if (v === true) return 'TRUE';
      if (v === false) return 'FALSE';
      if (v === null || v === undefined) return '';
      return String(v);
    }));
  });
  var range = sh.getRange(1, 1, data.length, headers.length);
  range.setNumberFormat('@');           // keep dates and ids as plain text
  range.setValues(data);
  sh.setFrozenRows(1);
  sh.getRange(1, 1, 1, headers.length).setFontWeight('bold').setBackground('#1C1814').setFontColor('#EFE7D8');
  sh.autoResizeColumns(1, Math.min(headers.length, 6));
}

function saveAll(req) {
  var current = meta();
  var incoming = Number(req.rev);
  if (current.rev > 0 && incoming !== current.rev) {
    var out = meta();
    out.ok = false;
    out.conflict = true;
    out.data = readAll();
    return out;
  }
  var db = req.data || {};
  writeTab('tours', db.tours || []);
  writeTab('events', db.events || []);
  writeTab('research', db.research || []);
  writeTab('routes', (db.routes || []).map(function (r) {
    return {id: r.id, name: r.name, tourId: r.tourId, notes: r.notes};
  }));
  var stops = [];
  (db.routes || []).forEach(function (r) {
    (r.stops || []).forEach(function (s, i) {
      stops.push({id: s.id, routeId: r.id, position: i + 1, name: s.name, lat: s.lat,
                  lng: s.lng, mins: s.mins, script: s.script, research: s.research});
    });
  });
  writeTab('stops', stops);
  writeTab('notes', (db.notes || []).map(function (n) {
    return {id: n.id, title: n.title, date: n.date, attendees: n.attendees, body: n.body, by: n.by};
  }));
  var actions = [];
  (db.notes || []).forEach(function (n) {
    (n.actions || []).forEach(function (a) {
      actions.push({id: a.id, noteId: n.id, text: a.text, who: a.who, due: a.due, done: a.done});
    });
  });
  writeTab('actions', actions);
  writeTab('media', (db.media || []).map(function (m) {
    var t = String(m.thumb || '');
    return {id: m.id, title: m.title, kind: m.kind, url: m.url, date: m.date,
            tags: m.tags, credit: m.credit, by: m.by, thumb: t.length > 45000 ? '' : t};
  }));
  writeTab('people', db.people || []);

  return setMeta(current.rev + 1, req.by);
}

   Black Austin Tours — internal operations app

/* ---------------- storage adapter ---------------- */
const Store = (() => {
  const mem = {};
  const has = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
  let local = false;
  if(!has){
    try{ localStorage.setItem('bat:probe','1'); localStorage.removeItem('bat:probe'); local = true; }
    catch(e){ local = false; }
  }
  let mode = has ? 'the shared workspace' : local ? 'this browser' : 'this session only';
  async function get(k){
    try{
      if(has){ const r = await window.storage.get(k, true); return r && r.value ? JSON.parse(r.value) : null; }
      if(local){ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }
      return mem[k] ?? null;
    }catch(e){ return mem[k] ?? null; }
  }
  async function set(k, v){
    const s = JSON.stringify(v);
    mem[k] = v;
    try{
      if(has){ await window.storage.set(k, s, true); return true; }
      if(local){ localStorage.setItem(k, s); return true; }
    }catch(e){ return false; }
    return true;
  }
  return { get, set, label: () => mode };
})();

const KEY = 'bat:v1:data';

function save(msg){

function fmtDate(iso, opts){
  if(!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('en-US', opts || {weekday:'short', month:'short', day:'numeric'});
}
function fmtTime(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const ap = h >= 12 ? 'pm' : 'am';
  return ((h % 12) || 12) + (m ? ':' + String(m).padStart(2,'0') : '') + ap;
}
function daysUntil(iso){
  const a = new Date(todayISO()+'T00:00:00'), b = new Date(iso+'T00:00:00');
  return Math.round((b - a) / 86400000);
}
function relDay(iso){
  const n = daysUntil(iso);
  if(n === 0) return 'Today';
  if(n === 1) return 'Tomorrow';
  if(n < 0) return Math.abs(n) + ' days ago';
  if(n < 7) return 'In ' + n + ' days';
  return fmtDate(iso);
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;

function jsq(v){ return String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

function sortByDate(a,b){ return (a.date + (a.time||'')).localeCompare(b.date + (b.time||'')); }

function seatStatus(ev){
  if(ev.status === 'cancelled') return {k:'cancelled', label:'Cancelled'};
  if(ev.status === 'private') return {k:'private', label:'Private booking'};
  const left = (ev.capacity||0) - (ev.booked||0);
  if(left <= 0) return {k:'full', label:'Sold out'};
  if(left <= Math.max(2, Math.round((ev.capacity||1)*0.25))) return {k:'limited', label:left + ' seats left'};
  return {k:'open', label:left + ' seats left'};
}
function seatBar(ev){
  const pct = ev.capacity ? Math.min(100, Math.round((ev.booked/ev.capacity)*100)) : 0;
  const cls = pct >= 100 ? 'max' : pct >= 75 ? 'hot' : '';
  return `<div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>`;
}

/* ---------------- modal + generic form ---------------- */
function closeModal(){ $('#modalroot').innerHTML = ''; }
function openModal(title, bodyHTML, footerHTML, wide){
  $('#modalroot').innerHTML = `<div class="scrim" data-scrim>
    <div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true">
      <header><h3>${esc(title)}</h3><button class="x" data-close aria-label="Close">&times;</button></header>
      <div class="body">${bodyHTML}</div>
      <footer>${footerHTML || '<button class="btn" data-close>Close</button>'}</footer>
    </div></div>`;
}

/* fields: {k, label, type, options, hint, rows, half} */
function formHTML(fields, v){
  return fields.map(f => {
    const val = v[f.k] ?? '';
    const id = 'f_' + f.k;
    let input;
    if(f.type === 'textarea') input = `<textarea id="${id}" ${f.rows?`style="min-height:${f.rows*22}px"`:''}>${esc(val)}</textarea>`;
    else if(f.type === 'select') input = `<select id="${id}">${f.options.map(o => `<option value="${esc(o.v)}"${String(o.v)===String(val)?' selected':''}>${esc(o.t)}</option>`).join('')}</select>`;
    else if(f.type === 'picklist'){
      const cur = Array.isArray(val) ? val : [];
      input = `<div class="picklist" id="${id}">${f.options.length ? f.options.map(o =>
        `<label><input type="checkbox" value="${esc(o.v)}"${cur.includes(o.v)?' checked':''}><span>${esc(o.t)}</span></label>`).join('')
        : '<div class="meta" style="padding:6px">Nothing to choose yet.</div>'}</div>`;
    }
    else if(f.type === 'tags') input = `<input type="text" id="${id}" value="${esc((val||[]).join(', '))}" placeholder="comma, separated">`;
    else input = `<input type="${f.type || 'text'}" id="${id}" value="${esc(val)}" ${f.step?`step="${f.step}"`:''} ${f.placeholder?`placeholder="${esc(f.placeholder)}"`:''}>`;
    return `<label class="field"${f.half?' style="display:inline-flex;width:100%"':''}><span>${esc(f.label)}</span>${input}${f.hint?`<span class="meta">${esc(f.hint)}</span>`:''}</label>`;
  }).join('');
}
function readForm(fields){
  const out = {};
  fields.forEach(f => {
    const el = document.getElementById('f_' + f.k);
    if(!el) return;
    if(f.type === 'picklist') out[f.k] = [...el.querySelectorAll('input:checked')].map(i => i.value);
    else if(f.type === 'tags') out[f.k] = el.value.split(',').map(s => s.trim()).filter(Boolean);
    else if(f.type === 'number') out[f.k] = Number(el.value || 0);
    else out[f.k] = el.value;
  });
  return out;
}
function openForm({title, fields, values = {}, onSave, wide, extra = ''}){
  openModal(title, `<div class="two-wrap">${formHTML(fields, values)}</div>${extra}`,
    `<button class="btn" data-close>Cancel</button><button class="btn primary" id="formsave">Save</button>`, wide);
  $('#formsave').onclick = () => {
    const data = readForm(fields);
    const err = onSave(data);
    if(!err) closeModal();
    else if(err !== 'skip') toast(err);
  };
  const first = $('.modal input, .modal textarea, .modal select');
  if(first) first.focus();
}
function confirmDelete(what, fn){
  openModal('Delete ' + what + '?', `<p>This removes it for everyone using this workspace. It can't be undone unless you have a backup export.</p>`,
    `<button class="btn" data-close>Keep it</button><button class="btn danger" id="okdel">Delete</button>`);
  $('#okdel').onclick = () => { fn(); closeModal(); };
}


/* ---------------- Google Sheets sync ---------------- */
const CFGKEY = 'bat:v1:config';
let CFG = {endpoint:'', token:'', sheetUrl:'', on:false};
let REV = 0, SYNC = {state:'local', msg:'', by:'', at:''};
let pushTimer = null, pollTimer = null;

const Cloud = {
  async call(payload, endpoint){
    const url = endpoint || CFG.endpoint;
    if(!url) throw new Error('No web app URL set.');
    const res = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},  // keeps it a simple request, no preflight
      body: JSON.stringify(payload), redirect:'follow'
    });
    const txt = await res.text();
    let j;
    try{ j = JSON.parse(txt); }
    catch(e){ throw new Error('The URL did not return data. Check that the deployment runs as you and is open to anyone with the link.'); }
    if(j.error) throw new Error(j.error);
    return j;
  },
  ping(endpoint, token){ return this.call({action:'ping', token: token ?? CFG.token}, endpoint); },
  load(){ return this.call({action:'load', token:CFG.token}); },
  push(){ return this.call({action:'save', token:CFG.token, rev:REV, by:personName(ME), data:DB}); }
};

function setSync(state, msg){ SYNC.state = state; SYNC.msg = msg || ''; renderSync(); }
function renderSync(){
  const el = $('#savedstate'); if(!el) return;
  const map = {local:'●', syncing:'◍', ok:'●', error:'▲'};
  const color = {local:'#9E937E', syncing:'#E8C877', ok:'#8FAE5D', error:'#D98E7E'}[SYNC.state];
  el.innerHTML = `<span style="color:${color}">${map[SYNC.state]}</span> ${esc(SYNC.msg)}` +
    (CFG.on ? ` <button class="btn sm" style="margin-left:6px" onclick="cloudPull()">Refresh</button>` : '');
}
async function loadConfig(){
  const c = await Store.get(CFGKEY);
  if(c) CFG = Object.assign(CFG, c);
}
function saveConfig(){ Store.set(CFGKEY, CFG); }

function scheduleCloudPush(){
  if(!CFG.on) return;
  clearTimeout(pushTimer);
  setSync('syncing', 'Saving to the sheet\u2026');
  pushTimer = setTimeout(cloudPush, 900);
}
async function cloudPush(){
  if(!CFG.on) return;
  try{
    const r = await Cloud.push();
    if(r.conflict){
      REV = r.rev; DB = normalize(r.data);
      await Store.set(KEY, DB);
      setSync('error', 'Someone saved first \u2014 loaded theirs');
      toast('Someone else saved while you were editing. Their version is now loaded, so redo your last change.');
      renderWho(); render();
      return;
    }
    REV = r.rev;
    SYNC.by = r.by; SYNC.at = r.updated;
    setSync('ok', 'Synced to the sheet');
  }catch(e){
    setSync('error', 'Sheet unreachable \u2014 saved locally');
  }
}
async function cloudPull(silent){
  if(!CFG.on) return;
  setSync('syncing', 'Pulling from the sheet\u2026');
  try{
    const r = await Cloud.load();
    REV = r.rev; SYNC.by = r.by; SYNC.at = r.updated;
    DB = normalize(r.data);
    await Store.set(KEY, DB);
    if(!DB.people.some(p => p.id === ME)) ME = DB.people[0] ? DB.people[0].id : null;
    setSync('ok', 'Synced to the sheet');
    renderWho(); render();
    if(!silent) toast('Loaded the latest from Google Sheets');
  }catch(e){
    setSync('error', e.message.slice(0,60));
    if(!silent) toast(e.message);
  }
}
function startPolling(){
  clearInterval(pollTimer);
  if(!CFG.on) return;
  pollTimer = setInterval(async () => {
    if($('.scrim') || SYNC.state === 'syncing') return;   // never yank the page mid-edit
    try{
      const r = await Cloud.ping();
      if(r.rev > REV) await cloudPull(true);
    }catch(e){ /* stay quiet, the next tick can try again */ }
  }, 25000);
}
function normalize(d){
  d = d || {};
  ['tours','events','research','routes','notes','media','people','contacts'].forEach(k => d[k] = d[k] || []);
  d.routes.forEach(r => r.stops = r.stops || []);
  d.notes.forEach(n => n.actions = n.actions || []);
  d.meta = d.meta || {};
  return d;
}

function attach(sid, rid){
  if(!rid) return;
  const s = curRoute().stops.find(x => x.id === sid);
  s.research = s.research || []; s.research.push(rid);
  save('Attached'); render();
}
function detach(sid, rid){
  const s = curRoute().stops.find(x => x.id === sid);
  s.research = s.research.filter(x => x !== rid);
  save(); render();
}
function moveStop(sid, dir){
  const st = curRoute().stops, i = st.findIndex(x => x.id === sid), j = i + dir;
  if(j < 0 || j >= st.length) return;
  [st[i], st[j]] = [st[j], st[i]];
  save(); render();
}
function delStop(sid){
  const r = curRoute();
  confirmDelete('this stop', () => { r.stops = r.stops.filter(x => x.id !== sid); save('Stop removed'); render(); });
}

/* ---------- map: Leaflet, with a plain grid fallback ---------- */
function mountMap(r){
  const wrap = $('#mapwrap');
  if(!wrap) return;
  const pts = r.stops.filter(s => isFinite(s.lat) && isFinite(s.lng));
  if(window.L && L.map){
    wrap.innerHTML = '<div id="map"></div>';
    mapObj = L.map('map', {scrollWheelZoom:false}).setView(pts.length ? [pts[0].lat, pts[0].lng] : [AUSTIN.lat, AUSTIN.lng], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:19, attribution:'&copy; OpenStreetMap'
    }).addTo(mapObj);
    mapMarkers = pts.map((s,i) => {
      const m = L.marker([s.lat, s.lng], {draggable:true,
        icon: L.divIcon({className:'', html:`<div class="numpin">${i+1}</div>`, iconSize:[26,26], iconAnchor:[13,13]})}).addTo(mapObj);
      m.bindPopup(`<b>${esc(s.name)}</b><br>${(s.research||[]).length} sources attached`);
      m.on('dragend', ev => {
        const ll = ev.target.getLatLng();
        s.lat = ll.lat; s.lng = ll.lng; save('Stop moved'); render();
      });
      return m;
    });
    if(pts.length > 1){
      mapLine = L.polyline(pts.map(s => [s.lat, s.lng]), {color:'#B07D12', weight:3, dashArray:'6 5'}).addTo(mapObj);
      mapObj.fitBounds(mapLine.getBounds().pad(0.25));
    }
    mapObj.on('click', e => addStopAt(e.latlng.lat, e.latlng.lng));
    setTimeout(() => mapObj.invalidateSize(), 60);
  } else {
    wrap.innerHTML = `<div id="fallbackmap"><div class="fg"></div>
      <div class="note">Offline mode: the map tiles could not load, so stops are plotted on an Austin grid. Coordinates are still real.</div></div>`;
    const el = $('#fallbackmap');
    const toXY = (lat,lng) => ({
      x: ((lng - BBOX.w) / (BBOX.e - BBOX.w)) * el.clientWidth,
      y: ((BBOX.n - lat) / (BBOX.n - BBOX.s)) * el.clientHeight
    });
    pts.forEach((s,i) => {
      const {x,y} = toXY(s.lat, s.lng);
      const pin = document.createElement('div');
      pin.className = 'fpin'; pin.style.left = x + 'px'; pin.style.top = y + 'px';
      pin.innerHTML = `<span>${i+1}</span>`; pin.title = s.name;
      el.appendChild(pin);
    });
    el.onclick = ev => {
      if(ev.target.closest('.fpin')) return;
      const b = el.getBoundingClientRect();
      const lng = BBOX.w + ((ev.clientX - b.left)/b.width) * (BBOX.e - BBOX.w);
      const lat = BBOX.n - ((ev.clientY - b.top)/b.height) * (BBOX.n - BBOX.s);
      addStopAt(lat, lng);
    };
  }
}

function wireDrop(){
  const d = $('#drop'); if(!d) return;
  d.ondragover = e => { e.preventDefault(); d.classList.add('over'); };
  d.ondragleave = () => d.classList.remove('over');
  d.ondrop = async e => {
    e.preventDefault(); d.classList.remove('over');
    const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
    if(!files.length) return toast('Images only. Add a link for video.');
    for(const f of files.slice(0,6)){
      const thumb = await shrink(f);
      DB.media.push({id:uid('m'), title:f.name.replace(/\.[^.]+$/,''), kind:'Photo', url:'', date:todayISO(), tags:[], credit:'', by:ME, thumb});
    }
    save(files.length + ' added'); render();
  };
}
function shrink(file){
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 420, sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = img.width * sc; c.height = img.height * sc;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.6));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

          <tr><td>Research entries</td><td class="num" style="text-align:right">${DB.research.length}</td></tr>
          <tr><td>Routes</td><td class="num" style="text-align:right">${DB.routes.length} (${DB.routes.reduce((s,r)=>s+r.stops.length,0)} stops)</td></tr>
          <tr><td>Meeting notes</td><td class="num" style="text-align:right">${DB.notes.length}</td></tr>
          <tr><td>Media items</td><td class="num" style="text-align:right">${DB.media.length}</td></tr>
          <tr><td>Team profiles</td><td class="num" style="text-align:right">${DB.people.length}</td></tr>
          <tr><td>Contacts</td><td class="num" style="text-align:right">${DB.contacts.length}</td></tr>
        </tbody></table>
      </div></div>
    </div>`;
}
function tourFields(){
  return [
    {k:'name', label:'Tour name', type:'text'},
    {k:'type', label:'Format', type:'text', placeholder:'Walking tour'},
    {k:'duration', label:'Length of time', type:'text', placeholder:'2 hrs'},
    {k:'distance', label:'Distance', type:'text', placeholder:'1 mile'},
    {k:'capacity', label:'Default capacity', type:'number'},
    {k:'meet', label:'Meeting point', type:'text'},
    {k:'blurb', label:'Description', type:'textarea', rows:5}
  ];
}
function newTour(){
  openForm({title:'Add a tour', fields:tourFields(), values:{capacity:15},
    onSave:d => { if(!d.name) return 'Name required.'; DB.tours.push({id:uid('t'), ...d}); save('Tour added'); render(); }});
}
function editTour(id){
  const t = byId(DB.tours, id);
  openForm({title:'Edit tour', fields:tourFields(), values:t,
    onSave:d => { Object.assign(t, d); save('Updated'); render(); }});
}
function delTour(id){
  confirmDelete('this tour', () => {
    DB.tours = DB.tours.filter(t => t.id !== id);
    DB.events = DB.events.filter(e => e.tourId !== id);
    save('Tour and its departures removed'); render();
  });
}
function exportData(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'black-austin-tours-backup-' + todayISO() + '.json';
  a.click();
  toast('Backup downloaded');
}
function importData(input){
  const f = input.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const d = JSON.parse(fr.result);
      if(!d.tours || !d.events) throw 0;
      DB = d; ME = DB.people[0].id;
      save('Backup loaded'); renderWho(); render();
    }catch(e){ toast("That file isn't a backup from this app."); }
  };
  fr.readAsText(f);
}
function resetAll(){
  confirmDelete('everything and start from sample data', () => {
    DB = seed(); ME = DB.people[0].id; routeId = null;
    save('Reset to sample data'); renderWho(); render();
  });
}


/* ---------------- Google Sheets panel ---------------- */
function sheetsPanel(){
  if(!CFG.on){
    return `<div class="panel"><header><h3>Google Sheets</h3></header><div class="body">
      <p style="margin-top:0">Not connected. Everything is saving to ${esc(Store.label())}, which means each person has their own copy.</p>
      <p class="meta">Connect a sheet and the whole team reads and writes the same data. Each part of the app gets its own tab, so you can also edit rows directly in the spreadsheet.</p>
      <div style="margin-top:12px"><button class="btn gold" onclick="setupSheets()">Connect Google Sheets</button></div>
    </div></div>`;
  }
  const when = SYNC.at ? new Date(SYNC.at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : 'not yet';
  return `<div class="panel"><header><h3>Google Sheets</h3><div class="right"><span class="status s-open">Connected</span></div></header><div class="body">
    <table><tbody>
      <tr><td>Last write</td><td style="text-align:right">${esc(when)}${SYNC.by?' by '+esc(SYNC.by):''}</td></tr>
      <tr><td>Revision</td><td class="num" style="text-align:right">${REV}</td></tr>
      <tr><td>Checking for changes</td><td style="text-align:right">every 25 seconds</td></tr>
    </tbody></table>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <button class="btn" onclick="cloudPull()">Pull latest</button>
      <button class="btn" onclick="cloudPush()">Push now</button>
      ${CFG.sheetUrl?`<a class="btn" href="${esc(CFG.sheetUrl)}" target="_blank" rel="noopener">Open the sheet</a>`:''}
      <button class="btn" onclick="setupSheets()">Change settings</button>
      <button class="btn danger" onclick="disconnectSheets()">Disconnect</button>
    </div>
    <p class="meta" style="margin-bottom:0;margin-top:12px">If two people save at the same moment, the second save is refused rather than overwriting the first \u2014 the app pulls the newer version and tells you to redo that one change.</p>
  </div></div>`;
}

function setupSheets(){
  const steps = `
    <ol style="margin:0 0 18px;padding-left:20px;line-height:1.75">
      <li>Make a new Google Sheet. Name it something like <b>Black Austin Tours \u2014 Operations</b>.</li>
      <li>In that sheet: Extensions, then Apps Script. Delete whatever is in the editor.</li>
      <li>Paste in the script below and save it.</li>
      <li>Click Deploy, then New deployment. Choose <b>Web app</b>.<br>
          Set <b>Execute as: Me</b> and <b>Who has access: Anyone with the link</b>, then Deploy and approve the permissions.</li>
      <li>Copy the web app URL it gives you \u2014 it ends in <b>/exec</b> \u2014 and paste it below.</li>
    </ol>
    <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">
      <button class="btn" onclick="downloadGS()">Download Code.gs</button>
      <button class="btn" onclick="copyGS()">Copy the script</button>
    </div>
    <textarea id="gsview" readonly style="min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px"></textarea>
    <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">`;
  openForm({
    title:'Connect Google Sheets',
    wide:true,
    fields:[
      {k:'endpoint', label:'Web app URL', type:'url', placeholder:'https://script.google.com/macros/s/.../exec'},
      {k:'token', label:'Access word', type:'text', hint:'Only if you set SHARED_TOKEN in the script. Leave empty otherwise.'},
      {k:'sheetUrl', label:'Link to the sheet itself', type:'url', hint:'Optional. Gives you an Open the sheet button.'}
    ],
    values:{endpoint:CFG.endpoint, token:CFG.token, sheetUrl:CFG.sheetUrl},
    extra:'',
    onSave:d => {
      if(!d.endpoint || !/\/exec\s*$/.test(d.endpoint.trim()))
        return 'Paste the deployment URL that ends in /exec.';
      connectSheets(d.endpoint.trim(), d.token.trim(), d.sheetUrl.trim());
      return 'skip';
    }
  });
  // drop the instructions above the form fields
  const body = document.querySelector('.modal .body');
  body.insertAdjacentHTML('afterbegin', steps);
  document.getElementById('gsview').value = document.getElementById('gscode').textContent.trim();
  document.getElementById('formsave').textContent = 'Connect';
}
function gsText(){ return document.getElementById('gscode').textContent.trim(); }
function downloadGS(){
  const b = new Blob([gsText()], {type:'text/javascript'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'Code.gs'; a.click();
  toast('Code.gs downloaded');
}
function copyGS(){
  const t = document.getElementById('gsview');
  t.focus(); t.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  if(!ok && navigator.clipboard) navigator.clipboard.writeText(gsText()).then(() => toast('Script copied')).catch(() => toast('Select the text and copy it'));
  else toast(ok ? 'Script copied' : 'Select the text and copy it');
}

async function connectSheets(endpoint, token, sheetUrl){
  setSync('syncing', 'Testing the connection\u2026');
  let ping;
  try{ ping = await Cloud.ping(endpoint, token); }
  catch(e){ setSync('error', 'Could not connect'); return openModal('Could not connect', `<p>${esc(e.message)}</p>
    <p class="meta">Two things catch people out: the deployment has to be set to <b>Anyone with the link</b>, and the URL has to be the one ending in <b>/exec</b>, not <b>/dev</b>. If you changed the script after deploying, publish a new version.</p>`,
    `<button class="btn" data-close>Close</button><button class="btn primary" onclick="closeModal();setupSheets()">Try again</button>`); }

  CFG = {endpoint, token, sheetUrl, on:true};
  saveConfig();
  REV = ping.rev || 0;

  let server = null;
  try{ const r = await Cloud.load(); server = r.data; REV = r.rev; SYNC.by = r.by; SYNC.at = r.updated; }catch(e){}
  const hasServerData = server && server.tours && server.tours.length;

  closeModal();
  if(!hasServerData){
    await cloudPush();
    await cloudPull(true);
    toast('Connected. This workspace is now in the sheet.');
    render();
    startPolling();
    return;
  }
  openModal('There is already data in that sheet',
    `<p>The sheet holds ${server.tours.length} tours, ${(server.events||[]).length} departures, and ${(server.research||[]).length} research entries. Which copy wins?</p>
     <p class="meta">This one only comes up the first time you connect.</p>`,
    `<button class="btn" id="useSheet">Use what is in the sheet</button>
     <button class="btn primary" id="useLocal">Upload what is in this workspace</button>`);
  document.getElementById('useSheet').onclick = async () => { closeModal(); await cloudPull(); startPolling(); };
  document.getElementById('useLocal').onclick = async () => { closeModal(); await cloudPush(); render(); startPolling(); };
}
function disconnectSheets(){
  confirmDelete('the connection to Google Sheets (the sheet itself stays put)', () => {
    CFG = {endpoint:'', token:'', sheetUrl:'', on:false};
    saveConfig(); clearInterval(pollTimer);
    setSync('local', 'Saved to ' + Store.label());
    toast('Disconnected. The sheet still has everything in it.');
    render();
  });
}
function addStarterRoutes(){
  const have = new Set(DB.routes.map(r => r.name));
  const add = starterRoutes().filter(r => !have.has(r.name));
  if(!add.length) return toast('All four starter routes are already here.');
  DB.routes.push(...add);
  save(add.length + ' route' + (add.length>1?'s':'') + ' added'); render();
}


/* One-time top-up for workspaces created before the starter routes shipped. */
function migrate(){
  if(DB.meta.starterRoutes) return;
  DB.routes = DB.routes.filter(r => !(r.name === 'East Austin Black History Walk \u2014 standard route' && r.stops.length === 3));
  const have = new Set(DB.routes.map(r => r.name));
  starterRoutes().forEach(r => { if(!have.has(r.name)) DB.routes.push(r); });
  if(!DB.tours.some(t => t.id === 't_pp')){
    DB.tours.push({id:'t_pp', name:'Pease Park & Shoal Creek Walk', type:'Walking tour', duration:'1.5 hrs',
      distance:'1 mile', capacity:15, price:'', meet:'Kingsbury Commons',
      blurb:'In development. Shoal Creek as a boundary, the 1865 encampment at Custer\u2019s Meadow, and the freedom colonies that grew up on either side of the park.'});
  }
  DB.meta.starterRoutes = true;
  Store.set(KEY, DB);
}

/* ================= boot ================= */
function renderWho(){
  const sel = $('#whoami');
  sel.innerHTML = DB.people.map(p => `<option value="${p.id}"${p.id===ME?' selected':''}>${esc(p.name)}</option>`).join('');
  sel.onchange = () => { ME = sel.value; render(); };
}
(async function init(){
  await loadConfig();
  DB = await Store.get(KEY);
  if(!DB || !DB.tours){ DB = seed(); await Store.set(KEY, DB); }
  DB = normalize(DB);
  migrate();
  ME = DB.people[0].id;
  setSync(CFG.on ? 'syncing' : 'local', CFG.on ? 'Connecting to the sheet\u2026' : 'Saved to ' + Store.label());
  renderWho();
  render();
  if(CFG.on){ await cloudPull(true); startPolling(); }
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
  $('#modalroot').addEventListener('click', e => {
    if(e.target.hasAttribute('data-scrim') || e.target.closest('[data-close]')) closeModal();
  });
})();

</script>
</body>
